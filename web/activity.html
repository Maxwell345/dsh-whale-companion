<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Whale World</title>
  <link rel="stylesheet" href="/dsh-whale/static/ui.css">
  <link rel="stylesheet" href="/dsh-whale/static/ui/activity.css">
</head>
<body class="activity-body">
  <header class="act-head">
    <div class="act-title">
      <span class="act-emoji" id="actEmoji">🎨</span>
      <div>
        <h1 id="actTitle">小肥鱼的小世界</h1>
        <p id="actSub">她自己在玩</p>
      </div>
    </div>
    <div class="act-meta" id="actMeta"></div>
    <div class="act-actions">
      <button class="btn ghost" id="btnStopPlay" hidden>结束游戏</button>
      <button class="btn" id="btnClose">关闭</button>
    </div>
  </header>
  <main class="act-main" id="actMain">
    <div class="act-loading">正在打开…</div>
  </main>
  <footer class="act-foot" id="actFoot" hidden></footer>
  <script src="/dsh-whale/static/ui.js"></script>
  <script src="/dsh-whale/static/ui/activity.js"></script>
</body>
</html>
